<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> TechSpace | Contact </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5) !important;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100 bg-dark text-light">

    <header>
        <nav class="navbar navbar-expand-md bg-dark navbar-dark fixed-top py-3 shadow border-bottom border-2 border-danger">
            <div class="container-fluid px-4">

                <!-- BRAND LOGO ZONE -->
                <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="./index.html">
                    <img src="https://api.iconify.design/lucide:cpu.svg?color=%23ffffff" alt="TechSpace Logo" height="30" class="me-2 d-inline-block align-top">
                    TechSpace
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#techspaceNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- NAV LINKS -->
                <div class="collapse navbar-collapse text-center" id="techspaceNav">
                    <ul class="navbar-nav nav-pills ms-auto pt-3 pt-md-0">
                        <li class="nav-item px-1 my-1 my-md-0">
                            <a class="nav-link text-white" href="./index.html"> Home </a>
                        </li>
                        <li class="nav-item px-1 my-1 my-md-0">
                            <a class="nav-link text-white" href="./products.html"> Products </a>
                        </li>
                        <li class="nav-item px-1 my-1 my-md-0">
                            <a class="nav-link text-white" href="./about.html"> About </a>
                        </li>
                        <li class="nav-item px-1 my-1 my-md-0">
                            <a class="nav-link text-white bg-danger bg-opacity-75 active shadow-sm" href="./contact.html"> Contact </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5 mt-5">
        <div class="row justify-content-center pt-3">
            
            <div class="col-11 col-sm-10 col-md-8 col-lg-6">
                <div class="mb-3">
                    <p class="small text-danger text-uppercase tracking-wider mb-0 fw-bold"> Get in Touch </p>
                    <h2 class="fw-bold text-white"> Contact Us </h2>
                    <p class="text-white-50 mb-4 small"> Have questions or need assistance? Our team is here to help! </p>

                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold text-white-50 small">Name</label>
                            <input type="text" class="form-control bg-black text-white border-secondary py-2" id="name" placeholder="Your Name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-white-50 small">Email</label>
                            <input type="email" class="form-control bg-black text-white border-secondary py-2" id="email" placeholder="Your Email">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label fw-semibold text-white-50 small">Message</label>
                            <textarea class="form-control bg-black text-white border-secondary py-2" id="message" rows="4" placeholder="Your Message"></textarea>
                        </div>
                        <button type="submit" class="btn btn-danger btn-lg w-100 mt-2 shadow bg-opacity-75 fs-6">Send Message</button>
                    </form>
                </div>   
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-light text-center py-4 border-top border-secondary mt-auto">
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2026 TechSpace. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
